    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .app-container {
            height: 100vh;
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            margin: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        /* Левая панель - Информация */
        .info-panel {
            width: 30%;
            background: white;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
        }
        
        /* Правая панель - Карта */
        .map-panel {
            width: 70%;
            position: relative;
        }
        
        
        /* Стили для информации о выбранном объекте */
        .selected-info {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .selected-info.active {
            display: block;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .selected-info h3 {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .info-detail {
            display: flex;
            margin-bottom: 12px;
            align-items: flex-start;
        }
        
        .info-label {
            font-weight: bold;
            color: #333;
            min-width: 120px;
            font-size: 0.95rem;
        }
        
        .info-value {
            color: #666;
            flex: 1;
            font-size: 0.95rem;
        }
        
        /* Заголовок */
        .app-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }
        
        .app-header h1 {
            color: #333;
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
        }
        
        .app-header p {
            color: #666;
            font-size: 1rem;
        }
        
        /* Секции */
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #444;
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 10px;
            color: #667eea;
        }
        
        /* Объекты в списке */
        .object-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .object-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: #f0f2ff;
        }
        
        .object-item h4 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .object-item p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        /* Легенда */
        .legend h5 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-align: center;
        }
        
        
        
        /* Кнопки управления */
        .map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            color: #667eea;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            background: #667eea;
            color: white;
        }
        
        /* Стили карты */
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }
        
        /* Адапт */
        @media (max-width: 1200px) {
            .info-panel {
                width: 35%;
            }
            .map-panel {
                width: 65%;
            }
        }
        
        @media (max-width: 992px) {
            .app-container {
                flex-direction: column;
                margin: 10px;
            }
            .info-panel, .map-panel {
                width: 100%;
                height: 50%;
            }
            .info-panel {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            .legend {
                bottom: 10px;
                left: 10px;
                padding: 15px;
            }
        }
        
        .custom-icon {
            background: transparent !important;
            border: none !important;
        }
        
        .leaflet-image-layer {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges; /* safari */
            image-rendering: pixelated; /* chrome */
            image-rendering: -moz-crisp-edges; /* firefox */
            image-rendering: -o-crisp-edges; /* opera */
            -ms-interpolation-mode: nearest-neighbor; /* ie */
        }
        .page2-button {
            /* между сайтами */
			display: block;
			width: 450px;

			margin: 30px auto;
			background-color: #FFBF00;
			color: #3B2F2F;

			background-color: #3B2F2F;
			color: #FFBF00;
			transform: scale(1.05);
